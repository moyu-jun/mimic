[package]
name = "mimic"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[workspace]
members = [
    "crates/elevation-protocol",
    "crates/elevated-helper",
    "crates/fuzz-runner",
]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mimic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10.9"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ini = { package = "rust-ini", version = "0.21" }
interception = "0.1"
mimic-elevation-protocol = { path = "crates/elevation-protocol" }

# 阶段 18：提示音录制 — cpal 采集麦克风，hound 写 WAV
cpal = "0.15"
hound = "3.5"
base64 = "0.22"
sha2 = "0.10.9"

# 阶段 10：管理员权限检测 + 提权重启
# 阶段 11：注册表驱动检测（Win32_System_Registry）
# 阶段 14：鼠标坐标拾取（Win32_System_LibraryLoader 提供 GetModuleHandleW）
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
